apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
      - name: multitool
        image: wbitt/network-multitool:minimal
        imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app
spec:
  selector: {app: frontend}
  ports:
  - port: 80
    targetPort: 80
---
